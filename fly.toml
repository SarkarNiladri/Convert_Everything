# fly.toml app configuration file generated for convert-everything on 2026-11-27T16:45:50Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'convert-everything'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
