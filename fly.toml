# Fly.io config. Run `fly launch --no-deploy` once to create your own app name,
# then replace the app value below with it.
app = 'convert-anything'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
